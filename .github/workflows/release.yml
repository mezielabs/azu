name: Preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version from both package manifests
        required: true
        type: string
      publish:
        description: Publish the verified preview tarballs (owner approval required)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  # Lint, typecheck, the three databases and the full browser suite in Chromium
  verify:
    uses: ./.github/workflows/ci.yml

  # The smoke subset in Firefox and WebKit (R02)
  smoke:
    uses: ./.github/workflows/smoke.yml

  packages:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build and inspect release packages
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm pack:check
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packages-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: packages
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'mezielabs/azu'
    runs-on: ubuntu-latest
    environment: npm-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: preview-packages-${{ github.sha }}
          path: artifacts/packages/
      - name: Recheck downloaded packages and npm OIDC support
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/check_release_packages.mjs artifacts/packages
          node -e "const {execFileSync}=require('node:child_process'); const [major,minor,patch]=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (major<11 || (major===11 && (minor<5 || (minor===5 && patch<1)))) throw Error('npm 11.5.1+ required for trusted publishing')"
      # pnpm pack already rewrites workspace:^ to the coordinated preview version.
      # Publish exactly the inspected tarballs, core first, never the source folders.
      #
      # Trusted publishing (OIDC) needs each package's trusted-publisher
      # setting on npmjs.com, which exists only once the package does, so
      # the first publish can't use it. For that one, set a short-lived
      # granular token as the npm-preview environment's NODE_AUTH_TOKEN
      # secret, then delete it (docs/release.md). Unset, npm uses OIDC.
      - name: Publish preview packages
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing with the npm-preview environment's NODE_AUTH_TOKEN"
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          else
            # An unset secret arrives as an empty string: leave nothing for npm to read
            unset NODE_AUTH_TOKEN
            echo "Publishing with npm trusted publishing (OIDC)"
          fi
          npm publish "artifacts/packages/mezielabs-azu-${AZU_RELEASE_VERSION}.tgz" --tag preview --access public --provenance
          npm publish "artifacts/packages/mezielabs-azu-react-${AZU_RELEASE_VERSION}.tgz" --tag preview --access public --provenance
