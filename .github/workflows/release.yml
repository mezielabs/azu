name: Preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version from both package manifests
        required: true
        type: string
      publish:
        description: Stage the verified preview tarballs on npm, for a maintainer to approve with 2FA
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  # Lint, typecheck, the three databases and the full browser suite in Chromium
  verify:
    uses: ./.github/workflows/ci.yml

  # The smoke subset in Firefox and WebKit (R02)
  smoke:
    uses: ./.github/workflows/smoke.yml

  packages:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build and inspect release packages
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm pack:check
      - uses: actions/upload-artifact@v7
        with:
          name: preview-packages-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: packages
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'mezielabs/azu'
    runs-on: ubuntu-latest
    environment: npm-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: preview-packages-${{ github.sha }}
          path: artifacts/packages/
      - name: Recheck downloaded packages and npm staging support
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/check_release_packages.mjs artifacts/packages
          node -e "const {execFileSync}=require('node:child_process'); const [major,minor]=execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (major<11 || (major===11 && minor<15)) throw Error('npm 11.15.0+ required for npm stage publish')"
      # Each tarball's full integrity and shasum, to check against
      # `npm stage view` and `npm stage download` before approving
      # (docs/release.md, section 7). npm's own log shortens the integrity.
      - name: Tarball checksums
        run: |
          for f in artifacts/packages/*.tgz; do
            echo "$(basename "$f")"
            echo "  shasum: $(sha1sum "$f" | cut -d' ' -f1)"
            echo "  integrity: sha512-$(openssl dgst -sha512 -binary "$f" | base64 -w0)"
          done
      # pnpm pack already rewrites workspace:^ to the coordinated preview version.
      # Stage exactly the inspected tarballs, core first, never the source folders.
      #
      # The trusted publishers on npmjs.com allow `npm stage publish` only, so
      # npm authenticates through OIDC with no token. Nothing is installable
      # until a maintainer approves each staged package with 2FA, core first
      # (docs/release.md, section 7).
      - name: Stage preview packages
        env:
          AZU_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm stage publish "artifacts/packages/mezielabs-azu-${AZU_RELEASE_VERSION}.tgz" --tag preview --access public --provenance
          npm stage publish "artifacts/packages/mezielabs-azu-react-${AZU_RELEASE_VERSION}.tgz" --tag preview --access public --provenance
